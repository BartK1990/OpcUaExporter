name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example: 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version metadata
        id: meta
        shell: pwsh
        run: |
          $rawVersion = "${{ github.event.inputs.version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            throw "Version input cannot be empty."
          }

          $normalizedVersion = $rawVersion.TrimStart('v', 'V')
          $tagName = "v$normalizedVersion"

          $parts = $normalizedVersion.Split('.')
          if ($parts.Length -lt 3) {
            throw "Version must include at least major.minor.patch."
          }

          "version=$normalizedVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore "${{ github.workspace }}/OpcUaExporter.sln"

      - name: Test exporter
        run: dotnet test "${{ github.workspace }}/tests/OpcUaExporter.Tests/OpcUaExporter.Tests.csproj" -c Release --no-restore

      - name: Test bridge
        # The integration tests start real OPC UA servers and generate certificates, so
        # they are left out of the release path and run on demand.
        run: >
          dotnet test "${{ github.workspace }}/tests/OpcUaBridge.Tests/OpcUaBridge.Tests.csproj"
          -c Release --no-restore --filter "Category!=Integration"

      - name: Publish portable
        run: >
          dotnet publish "${{ github.workspace }}/src/OpcUaExporter.Wpf/OpcUaExporter.Wpf.csproj"
          -c Release
          --self-contained false
          -o "${{ github.workspace }}/artifacts/portable"

      - name: Publish win_x64
        run: >
          dotnet publish "${{ github.workspace }}/src/OpcUaExporter.Wpf/OpcUaExporter.Wpf.csproj"
          -c Release
          -r win-x64
          --self-contained false
          -o "${{ github.workspace }}/artifacts/win_x64"

      - name: Publish self-contained
        run: >
          dotnet publish "${{ github.workspace }}/src/OpcUaExporter.Wpf/OpcUaExporter.Wpf.csproj"
          -c Release
          -r win-x64
          --self-contained true
          -o "${{ github.workspace }}/artifacts/self-contained"

      # The bridge is published to a plain folder, never single-file: it resolves its
      # logs, configuration and certificates from the directory its executable sits in.
      - name: Publish bridge self-contained
        run: >
          dotnet publish "${{ github.workspace }}/src/OpcUaBridge.Host/OpcUaBridge.Host.csproj"
          -c Release
          -r win-x64
          --self-contained true
          -o "${{ github.workspace }}/artifacts/bridge-self-contained"

      - name: Publish bridge win_x64
        run: >
          dotnet publish "${{ github.workspace }}/src/OpcUaBridge.Host/OpcUaBridge.Host.csproj"
          -c Release
          -r win-x64
          --self-contained false
          -o "${{ github.workspace }}/artifacts/bridge-win_x64"

      - name: Archive output variants
        shell: pwsh
        run: |
          $repoRoot = "${{ github.workspace }}"
          $version = "${{ steps.meta.outputs.version }}"
          $dist = Join-Path $repoRoot "artifacts/dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Compress-Archive -Path (Join-Path $repoRoot "artifacts/portable/*") -DestinationPath (Join-Path $dist "OpcUaExporter-$version-portable.zip") -Force
          Compress-Archive -Path (Join-Path $repoRoot "artifacts/win_x64/*") -DestinationPath (Join-Path $dist "OpcUaExporter-$version-win_x64.zip") -Force
          Compress-Archive -Path (Join-Path $repoRoot "artifacts/self-contained/*") -DestinationPath (Join-Path $dist "OpcUaExporter-$version-self-contained.zip") -Force

          Compress-Archive -Path (Join-Path $repoRoot "artifacts/bridge-self-contained/*") -DestinationPath (Join-Path $dist "OpcUaBridge-$version-self-contained.zip") -Force
          Compress-Archive -Path (Join-Path $repoRoot "artifacts/bridge-win_x64/*") -DestinationPath (Join-Path $dist "OpcUaBridge-$version-win_x64.zip") -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.version }}
          path: |
            ${{ github.workspace }}/artifacts/dist/OpcUaExporter-${{ steps.meta.outputs.version }}-portable.zip
            ${{ github.workspace }}/artifacts/dist/OpcUaExporter-${{ steps.meta.outputs.version }}-win_x64.zip
            ${{ github.workspace }}/artifacts/dist/OpcUaExporter-${{ steps.meta.outputs.version }}-self-contained.zip
            ${{ github.workspace }}/artifacts/dist/OpcUaBridge-${{ steps.meta.outputs.version }}-self-contained.zip
            ${{ github.workspace }}/artifacts/dist/OpcUaBridge-${{ steps.meta.outputs.version }}-win_x64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            ${{ github.workspace }}/artifacts/dist/OpcUaExporter-${{ steps.meta.outputs.version }}-portable.zip
            ${{ github.workspace }}/artifacts/dist/OpcUaExporter-${{ steps.meta.outputs.version }}-win_x64.zip
            ${{ github.workspace }}/artifacts/dist/OpcUaExporter-${{ steps.meta.outputs.version }}-self-contained.zip
            ${{ github.workspace }}/artifacts/dist/OpcUaBridge-${{ steps.meta.outputs.version }}-self-contained.zip
            ${{ github.workspace }}/artifacts/dist/OpcUaBridge-${{ steps.meta.outputs.version }}-win_x64.zip
